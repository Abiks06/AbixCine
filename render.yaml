# Render Blueprint: New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: abixcine-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render's edge adds one proxy hop; only that X-Forwarded-For entry is trusted.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Supabase Postgres (free tier, not deleted after 30 days like Render's free database).
      # Use the *Session pooler* connection string (Supabase > Connect > Session pooler): Render's
      # free services can't reach Supabase's IPv6-only direct host. See server/SUPABASE.md.
      - key: DATABASE_URL
        sync: false
      - key: TMDB_KEY
        sync: false
